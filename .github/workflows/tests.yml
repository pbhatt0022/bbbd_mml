name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"        # D-22
          cache: pip

      # CPU-only torch: the default wheel drags in ~2 GB of CUDA the runner
      # has no GPU for. Installed first so ".[dev]" finds it already satisfied.
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install
        run: pip install -e ".[dev]"

      - name: Versions
        run: |
          python -c "import numpy, scipy, pandas, sklearn, torch, mne, neurokit2 as nk; \
            print('\n'.join(f'{m.__name__:12s} {m.__version__}' \
            for m in (numpy, scipy, pandas, sklearn, torch, mne, nk)))"

      - name: Tests
        run: pytest -q

      # The notebooks are run by hand on Colab, so nothing else checks that a cell
      # is valid Python until someone runs it. This catches the two ways the
      # generated .ipynb has broken before: bad syntax, and source lines that
      # lost their trailing newline and render as one concatenated line.
      - name: Notebooks parse
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          from IPython.core.inputtransformer2 import TransformerManager
          tm, bad = TransformerManager(), 0
          for p in sorted(pathlib.Path("notebooks").glob("*.ipynb")):
              nb = json.loads(p.read_text(encoding="utf-8"))
              for i, c in enumerate(nb["cells"]):
                  if c["cell_type"] != "code":
                      continue
                  src = "".join(c["source"])
                  if "\n" not in src and len(src) > 80:
                      print(f"{p}:cell {i}: source lines lost their newlines")
                      bad += 1
                      continue
                  try:
                      compile(tm.transform_cell(src), f"{p}:{i}", "exec")
                  except SyntaxError as e:
                      print(f"{p}:cell {i}: {e}")
                      bad += 1
              print(f"{p}: {len(nb['cells'])} cells")
          sys.exit(bad)
          EOF
