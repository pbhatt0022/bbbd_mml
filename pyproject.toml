[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bbbd"
version = "0.1.0"
description = "Multimodal prediction of learning from brain, body and behaviour signals (BBBD), DATA404 MML"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "mne>=1.7",
    "neurokit2>=0.2.10",
    "torch>=2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter", "ipykernel"]
pid = ["dit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
