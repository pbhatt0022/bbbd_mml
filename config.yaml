# bbbd_mml configuration. Every notebook and script reads this file.
# Each setting that can change a result points to its Decision Log row (docs/decision_log.md).
# Status: values marked PROPOSED are not final until the row is Decided.
# Changing a value after the prereg-v1 tag = log a deviation in docs/deviations.md.

project:
  name: bbbd_mml
  config_version: "0.1.0"

paths:
  # Colab default. Locally, point this at your copy of the Drive folder.
  data_root: /content/drive/MyDrive/MML_BBBD
  raw: "{data_root}/01_data_raw"          # unzipped BIDS experiments, read-only
  interim: "{data_root}/02_data_interim"  # cleaned signals, per modality / variant
  features: "{data_root}/03_features"     # Parquet feature tables
  results_drive: "{data_root}/04_results" # large outputs (checkpoints, embeddings)
  results_repo: results                   # small outputs, versioned in git
  run_registry: docs/run_registry.csv

seeds:
  global: 2026        # set in every notebook via bbbd.runlog.set_seed
  cv_repeats: [11, 22, 33, 44, 55, 66, 77, 88, 99, 110]
  dl_training: [1, 2, 3]

scope:                                   # D-03
  eye_experiments: [1, 2, 3, 4, 5]
  eeg_ecg_experiments: [2, 3, 4, 5]
  resp_experiments: [4, 5]
  exp5_session2: separate                # not pooled

signals:
  expected_sfreq_hz: 128                 # Exp 1 gaze sidecar = 128 Hz (verified 14 Oct). EEG/ECG BDF: UNVERIFIED

target:                                  # D-04, D-10
  primary: quiz_prop_correct
  normalise: zscore_within_video_and_experiment
  auxiliary: attend_vs_distract           # Exps 1-3

exclusions:                              # PROPOSED, preregistration section 2
  eye_max_invalid_frac: 0.50
  eeg_max_bad_channel_frac: 0.20
  eeg_max_bad_time_frac: 0.10
  ecg_min_detected_beat_frac: 0.80

eye:                                     # V1 default
  saccade_velocity_deg_s: 30             # used in progress-review result (Exp 1)
  blink_pad_ms: 100
  max_interp_gap_ms: 250
  screen:                                # UNVERIFIED: fill from sidecar / paper methods
    width_px: null
    height_px: null
    width_cm: null
    distance_cm: null

ecg:
  method: neurokit                       # nk.ecg_peaks default
  rr_min_ms: 300
  rr_max_ms: 2000
  match_tolerance_ms: 50                 # H0a
  match_f1_threshold: 0.95               # H0a, PROPOSED

eeg:                                     # D-12, D-13
  variant: V1
  highpass_hz: 0.5
  lowpass_hz: null                       # released data already limited by 128 Hz sampling
  line_freq_hz: 60
  notch_16hz_if_detected: true
  bad_channel_z: 3.0
  artifact_iqr_mult: 4.0
  eye_artifact: eog_regression           # V3 = ica
  reference: average
  bands_hz:
    delta: [1, 4]
    theta: [4, 8]
    alpha: [8, 13]
    beta: [13, 30]
  regions:                               # BioSemi 64 labels; check against channels.tsv
    frontal: [Fp1, Fpz, Fp2, AF3, AFz, AF4, F1, Fz, F2, F3, F4]
    central: [FC1, FCz, FC2, C1, Cz, C2, C3, C4]
    parietal: [CP1, CPz, CP2, P1, Pz, P2, P3, P4]
    occipital: [PO3, POz, PO4, O1, Oz, O2]
  corrca_n_components: 3

cv:                                      # D-09, D-11, D-15
  n_splits: 5
  group_by: subject
  inner_splits: 3
  second_scheme: leave_one_video_out
  primary_metric: spearman

stats:
  n_permutations: 1000
  n_bootstrap: 2000
  equivalence_margin_rho: 0.10           # H1b, PROPOSED
  alpha: 0.05
  correction: holm

dl:                                      # RQ4, D-17
  window_s: 4.0
  window_overlap: 0.5
  embed_dim: 128
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 1.0e-2
  max_epochs: 50
  early_stopping_patience: 5
  modality_dropout_p: 0.3
  contrastive_temperature: 0.07
  retrain_per_outer_fold: true
